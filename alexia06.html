<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-image: url(POKE.jpg);
        }
        button{
            width: 50px;
            height: 50px;
            background-color: rgb(223, 218, 227);
            border-color: rgb(144, 86, 167);
            border-radius: 50px;
            position: absolute;
            top: 500px;
            left: 400px;
        }
        button:hover{
            background-color: rgb(197, 151, 240);
        }
        .pokeImg{
            position: absolute;
            background-color: transparent;
            left: 1%;
            top: 1%;
            width: 15%;
        }
        .placeholder{
            width: 200px;
            height: 50px;
            position: absolute;
            border-radius: 10px;
            background-color: transparent;
            text-align: absolute;
            text-shadow: 2px;
            font-size: 25px;
            z-index: 2;
            top: 72%;
            left: 10%
        }
        .pokeImg1{
            position: absolute;
            color: rgb(194, 154, 95);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size:25px;
        }
      
    </style>
   <input type="text" placeholder="Pokemones" id="pokeName" class="placeholder">
   <img src="pokeball.png" alt="Pokeball" id="pokeImg" width="200px" class="pokeImg">

   <div id="pokename" class="pokeImg1" style="top: 50px; left:430px;"> Nombre del pokemon:</div>

   <div id="pokehe" class="pokeImg1" style="top: 90px; left:430px;">Altura del pokemon:</div>

   <div id="pokewe" class="pokeImg1" style="top: 130px; left:430px;">Peso del pokemon:</div>

   <div id="poketype" class="pokeImg1" style="top: 170px; left:430px;">Tipo de pokemon:</div>

   <div id="pokeitem" class="pokeImg1" style="top: 210px; left:430px;">Item del pokemon:</div>

   <div id="pokemove1" class="pokeImg1" style="top: 250px; left:90px;">Movimiento del pokemon:</div>

<div id="pokemove2" class="pokeImg1" style="top: 290px; left:90px;">Movimiento del pokemon:</div>

<div id="pokemove3" class="pokeImg1" style="top: 330px; left:90px;">Movimiento del pokemon:</div>

<div id="pokemove4" class="pokeImg1" style="top: 370px; left:90px;">Movimiento del pokemon:</div>

<div id="pokeid" class="pokeImg1" style="left: 410px; top:300px; font-size: 25px;"></div>
<div id="pokeorder" class="pokeImg1" style="left: 410px; top:350px; font-size: 25px;"></div>


 

   <button onclick="fetchPokemon()" class="button"></button>
   <div class="grafica">
    <canvas id="miCanvas"></canvas>
   </div>
   <script>
    const fetchPokemon = () => {
        const pokeNameInput = document.getElementById("pokeName");
        let pokeName = pokeNameInput.value;
        pokeName = pokeName.toLowerCase();
        const url=`https://pokeapi.co/api/v2/pokemon/${pokeName}`;

        fetch(url).then((res) =>{
            if(res.status != "200"){
                console.log(res);
            }else{
                return res.json();
            }
        }).then((data) => { 
            if(data){
                console.log(data);
                let pokeImg = data.sprites.front_default;
                pokeImage(pokeImg);
                let name=document.getElementById('pokename');
                name.innerHTML=`Name: ${data.forms[0].name}`;

                let element1=document.getElementById('pokehe');
                element1.innerHTML=`Altura: ${data.height}`; 

                let element2=document.getElementById('pokewe');
                element2.innerHTML=`Peso: ${data.weight}`;

                let element3=document.getElementById('pokeorder');
                element3.innerHTML=`Order: #${data.order}`;

                let element4=document.getElementById('pokeid');
                element4.innerHTML=`Id: #${data.id}`;

                let element5=document.getElementById('pokeitem');
                element5.innerHTML=`Habilidades: ${data.abilities[0].ability.name}`;

                let element6=document.getElementById('poketype');
                element6.innerHTML=`Tipo: ${data.types[0].type.name}`;

                let element7=document.getElementById('pokemove1');
                element7.innerHTML=`Move1: ${data.moves[0].move.name}`;

                let element8=document.getElementById('pokemove2');
                element8.innerHTML=`Move2: ${data.moves[1].move.name}`;

                let element9=document.getElementById('pokemove3');
                element9.innerHTML=`Move3: ${data.moves[2].move.name}`;

                let element10=document.getElementById('pokemove4');
                element10.innerHTML=`Move4: ${data.moves[3].move.name}`;
               

                const miCanvas=document.getElementById("miCanvas").getContext("2d");
                if(window.miCanva != undefined)
                window.miCanva.destroy();
            window.miCanva=new Chart (miCanvas,{
                type: "bar",
                data: {
                    labels: ["HP", "Attack", "Defense", "Special-A", "Special-D", "Speed"],
                    datasets:[
                        {
                      label: `${data.form[0].name}`,
                      backgroundcolor: 'rgba(154,62,35,1)',
                      
                      data: [`${data.stats[0].base_stat}`,
                      `${data.stats[1].base_stat}`,
                      `${data.stats[2].base_stat}`,
                      `${data.stats[3].base_stat}`,
                      `${data.stats[4].base_stat}`,
                      `${data.stats[5].base_stat}`],

                      borderColor: [
                        'rgba (255,99,132, 1)',
                        'rgba (355,206,86, 1)',
                        'rgba (75,192,192, 1)',
                        'rgba (153,102,255, 1)',
                        'rgba (255,159,64, 1)'],
                      backgroundColor: [
                      'rgba (255,99,132, 0.5)',
                      'rgba (54,162,235, 0.5)',
                      'rgba (255,206,86, 0.5)',
                      'rgba (75,192,192, 0.5)',
                      'rgba (255,159,64, 0.5)'
                      ], borderWith:1,
                        } ] },
                    options: {
                        scales: {
                            x: {
                                ticks: {
                                    maxRotation:90,
                                    minRotation:90,
                                    color: 'purple',
                                    font: {size: 15},    
                            }
                             }}}
            })} });

              const pokeImage = (url)=> {
                const pokePhoto = document.getElementById("pokeImg");
                pokePhoto.src=url;
              } }       
    
   </script>

</body>
</html>
