<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta name http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Peliculas</title>
</head>
<body>
    <style>
        *{
            box-sizing: border-box;
        }
:root{
    --primer-color: #b0e0ff; 
    --segundo-color: #ffe4a1; 
    --tercero-color: #87cfff; 
    --cuarto-color: #ffdf91; 
    --quinto-color: #68b0dd;
}
   body{
            background-color: var(--primer-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        header{
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--cuarto-color);
            align-items: center;
        }
        .search{
            background-color: white;
            border: 5px solid var(--quinto-color);
            border-radius: 50px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            padding: 8px 15px;
            color: var(--quinto-color);
        }
        .search::placeholder{
            color: var(--tercer-color) ;
        }
        .search:focus{
            outline: none;
            background-color: white
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje{
            width: 400px;
            margin: 15px;
            background-color: var(--segundo-color);
            box-shadow: 10px 15px 1px black;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img{
            width: 80%;
            height: 400px;
        object-fit: contain;
        }
        .personaje-info{
   color: var(--tercero-color);
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 15px;
   padding: 0.8px 15px 15px;
   letter-spacing: 5px;
        }
        .personaje-info h3{
            color: black;
            margin-top: 0;
        }
              .personaje-info h1{
            color: var(--quinto-color);
            margin-top: 0;
        }
        .overview{
            background-color: #fff;
            padding: 15px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 1s ease-in;
        }
        .personaje:hover .overview{
            transform: translateY(0);
        }
    </style>

    <header> 
        <img src="cine.jpg" alt="logo" class="logo" style="width: 100px"; height="70px;">
         <form id="form">
        <input type="text" id="search" class="search" placeholder="Busca un personaje"></form>
    </header>
     <main id="main"></main>

    <script>
const API_URL_Ricky = 'https://rickandmortyapi.com/api/character';
  const API_URL_Potter = 'https://hp-api.onrender.com/api/characters';

  const main = document.getElementById('main');
  const form = document.getElementById('form');
  const search = document.getElementById('search');

  getcharacter();

  async function getcharacter() {
    const [resRicky, resPotter] = await Promise.all([
      fetch(API_URL_Ricky).then(res => res.json()),
      fetch(API_URL_Potter).then(res => res.json())
    ]);

    const morty = resRicky.results || [];
    const harry = resPotter || [];

    showcharacter([...harry, ...morty]);
  }

  function showcharacter(character) {
    main.innerHTML = '';

    character.forEach((char) => {
      let name = char.name || 'Desconocido';
      let gender = char.gender || 'No identificado';
      let species = char.species || 'Desconocida';
      let image = char.image || '';
        let actor = char.actor || 'Desconocido';
      let status = char.status || (char.alive === false ? 'Deceased' : 'Alive');
      let house = char.house || 'Desconocido';

      const characterElement = document.createElement('div');
      characterElement.classList.add('personaje');

        characterElement.innerHTML = `
          <img src="${image}" alt="${name}">

          <div class="personaje-info">
            <h3>${name}</h3>
            <br>${gender}
          </div>

          <div class="overview">
            <h3>Descripción</h3>
             <p><strong>Especie:</strong> ${actor}</p>
            <p><strong>Estado:</strong> ${status}</p>
            <p><strong>Especie:</strong> ${species}</p>
             <p><strong>Casa:</strong> ${house}</p>
             
          </div>`;
     

      main.appendChild(characterElement);})}

                    form.addEventListener('submit', (e) =>{
                    e.preventDefault()
                    const searchTerm = search.value.toLowerCase();
                    if(searchTerm && searchTerm !== ''){
                        getCharacters(API_URL + `?name=${searchTerm}`)
                        search.value='';
                    }else{
                        window.location.reload();
                    }
                })   
      </script>
</body>
</html>
